name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/super-linter.yml@4ad6729e601bf0b89eb08d8bf6ebc0e9cf91b775 # v1
    with:
      # Graduated from soft-launch. A full-codebase pass (VALIDATE_ALL_CODEBASE=true,
      # run locally against super-linter v8.6.0 with this repo's exact CI env)
      # reported 183 PowerShell findings; all are now either fixed at source or
      # excluded with justification in .github/linters/.powershell-psscriptanalyzer.psd1,
      # and the repo is clean. Blocking from here keeps it that way.
      soft-launch: false
